<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhijeet R. Patil | Github Project Showcase</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --input-bg: #0f172a;
      --badge-bg: #1e3a8a;
      --badge-text: #93c5fd;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --input-bg: #ffffff;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .header-title h1 {
      font-size: 2.25rem;
      font-weight: 800;
    }

    .header-title p {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 0.25rem;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1rem;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .search-box {
      flex: 1;
      min-width: 260px;
    }

    .search-box input, .filter-box select {
      width: 100%;
      padding: 0.65rem 1rem;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus, .filter-box select:focus {
      border-color: var(--accent);
    }

    .filter-box {
      min-width: 180px;
    }

    .results-count {
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      width: 100%;
      margin-top: -0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    /* Live Preview Box with Scaled iFrame */
    .preview-container {
      width: 100%;
      height: 200px;
      background-color: var(--input-bg);
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .preview-iframe {
      width: 1280px;
      height: 800px;
      border: 0;
      transform: scale(0.25);
      transform-origin: 0 0;
      pointer-events: none; /* Allows click-through to card */
    }

    .preview-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-transform: capitalize;
    }

    .card-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      border-color: var(--accent);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .pagination button {
      padding: 0.6rem 1.25rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .pagination button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-info {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 500;
    }

    #status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      color: var(--muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>Abhijeet R. Patil</h1>
        <p>Live Web Applications & GitHub Pages Demos</p>
      </div>
      <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle Theme">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Dark</span>
      </button>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search by project name or keywords..." />
      </div>
      <div class="filter-box">
        <select id="language-select">
          <option value="all">All Languages</option>
        </select>
      </div>
      <div class="results-count" id="results-count">Loading projects...</div>
    </div>

    <div id="projects-grid" class="grid">
      <div id="status">Fetching projects from GitHub...</div>
    </div>

    <div class="pagination" id="pagination-controls" style="display: none;">
      <button id="prev-btn" disabled>&larr; Previous</button>
      <span class="page-info" id="page-info">Page 1 of 1</span>
      <button id="next-btn" disabled>Next &rarr;</button>
    </div>
  </div>

  <script>
    const USERNAME = 'abhijeetr7';
    const ITEMS_PER_PAGE = 10;

    let allProjects = [];
    let filteredProjects = [];
    let currentPage = 1;

    const grid = document.getElementById('projects-grid');
    const statusEl = document.getElementById('status');
    const searchInput = document.getElementById('search-input');
    const languageSelect = document.getElementById('language-select');
    const resultsCount = document.getElementById('results-count');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');
    const paginationControls = document.getElementById('pagination-controls');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeUI(savedTheme);
    }

    function updateThemeUI(theme) {
      if (theme === 'dark') {
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'Dark';
      } else {
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'Light';
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeUI(newTheme);
    });

    async function init() {
      initTheme();
      try {
        const response = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
        if (!response.ok) throw new Error('Failed to load repositories.');
        
        const repos = await response.json();

        allProjects = repos.filter(repo => repo.has_pages || (repo.homepage && repo.homepage.trim() !== ''));

        if (allProjects.length === 0) {
          statusEl.textContent = 'No live GitHub Pages projects found.';
          resultsCount.textContent = '0 projects found';
          return;
        }

        populateLanguageFilter(allProjects);
        applyFilters();

        searchInput.addEventListener('input', () => { currentPage = 1; applyFilters(); });
        languageSelect.addEventListener('change', () => { currentPage = 1; applyFilters(); });
        prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); } });
        nextBtn.addEventListener('click', () => { if (currentPage < totalPages()) { currentPage++; renderPage(); } });

      } catch (err) {
        statusEl.textContent = 'Failed to load projects. Please try again later.';
        resultsCount.textContent = '';
        console.error(err);
      }
    }

    function populateLanguageFilter(projects) {
      const languages = [...new Set(projects.map(p => p.language).filter(Boolean))];
      languages.forEach(lang => {
        const opt = document.createElement('option');
        opt.value = lang;
        opt.textContent = lang;
        languageSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      const query = searchInput.value.toLowerCase();
      const selectedLang = languageSelect.value;

      filteredProjects = allProjects.filter(project => {
        const matchesQuery = project.name.toLowerCase().includes(query) || 
                             (project.description && project.description.toLowerCase().includes(query));
        const matchesLang = selectedLang === 'all' || project.language === selectedLang;
        return matchesQuery && matchesLang;
      });

      resultsCount.textContent = `Showing ${filteredProjects.length} live project${filteredProjects.length === 1 ? '' : 's'}`;
      renderPage();
    }

    function totalPages() {
      return Math.ceil(filteredProjects.length / ITEMS_PER_PAGE) || 1;
    }

    function renderPage() {
      grid.innerHTML = '';

      if (filteredProjects.length === 0) {
        grid.innerHTML = '<div id="status">No matching projects found.</div>';
        paginationControls.style.display = 'none';
        return;
      }

      paginationControls.style.display = 'flex';

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const pageItems = filteredProjects.slice(startIndex, endIndex);

      pageItems.forEach(repo => {
        const liveUrl = repo.homepage && repo.homepage.startsWith('http') 
          ? repo.homepage 
          : `https://${USERNAME}.github.io/${repo.name}/`;

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="preview-container">
            <iframe src="${liveUrl}" class="preview-iframe" loading="lazy" title="${repo.name} Preview"></iframe>
            <div class="preview-overlay"></div>
          </div>
          <div class="card-body">
            <h2 class="card-title">${repo.name.replace(/-/g, ' ')}</h2>
            <p class="card-desc">${repo.description || 'No description provided.'}</p>
            <div class="card-footer">
              ${repo.language ? `<span class="badge">${repo.language}</span>` : '<span></span>'}
              <div class="actions">
                <a href="${liveUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Live Demo</a>
                <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="btn btn-outline">Code</a>
              </div>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      pageInfo.textContent = `Page ${currentPage} of ${totalPages()}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages();
    }

    init();
  </script>
</body>
</html>
