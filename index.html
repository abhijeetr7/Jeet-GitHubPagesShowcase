<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhijeet R. Patil | GitHub Pages Showcase</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input, .filter-box select {
      width: 100%;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus, .filter-box select:focus {
      border-color: var(--accent);
    }

    .filter-box {
      min-width: 180px;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -4px rgb(0 0 0 / 0.15);
    }

    /* Thumbnail Preview */
    .preview-container {
      width: 100%;
      height: 180px;
      background-color: #f1f5f9;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: opacity 0.3s ease;
    }

    .preview-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      background: #e2e8f0;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-transform: capitalize;
    }

    .card-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      border: 1px solid #bfdbfe;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    /* Pagination controls */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .pagination button {
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .page-info {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 500;
    }

    #status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 0;
      color: var(--muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Abhijeet Patil</h1>
      <p>Live GitHub Pages Applications & Interactive Demos</p>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search projects by name or keywords..." />
      </div>
      <div class="filter-box">
        <select id="language-select">
          <option value="all">All Languages</option>
        </select>
      </div>
    </div>

    <div id="projects-grid" class="grid">
      <div id="status">Fetching live repositories...</div>
    </div>

    <div class="pagination" id="pagination-controls" style="display: none;">
      <button id="prev-btn" disabled>&larr; Previous</button>
      <span class="page-info" id="page-info">Page 1 of 1</span>
      <button id="next-btn" disabled>Next &rarr;</button>
    </div>
  </div>

  <script>
    const USERNAME = 'abhijeetr7';
    const ITEMS_PER_PAGE = 10;

    let allProjects = [];
    let filteredProjects = [];
    let currentPage = 1;

    const grid = document.getElementById('projects-grid');
    const statusEl = document.getElementById('status');
    const searchInput = document.getElementById('search-input');
    const languageSelect = document.getElementById('language-select');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');
    const paginationControls = document.getElementById('pagination-controls');

    async function init() {
      try {
        const response = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
        if (!response.ok) throw new Error('Failed to load repositories');
        
        const repos = await response.json();

        // Filter projects that have GitHub Pages enabled or a homepage setting
        allProjects = repos.filter(repo => repo.has_pages || (repo.homepage && repo.homepage.trim() !== ''));

        if (allProjects.length === 0) {
          statusEl.textContent = 'No live GitHub Pages projects found.';
          return;
        }

        populateLanguageFilter(allProjects);
        applyFilters();

        // Event listeners for interactivity
        searchInput.addEventListener('input', () => { currentPage = 1; applyFilters(); });
        languageSelect.addEventListener('change', () => { currentPage = 1; applyFilters(); });
        prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); } });
        nextBtn.addEventListener('click', () => { if (currentPage < totalPages()) { currentPage++; renderPage(); } });

      } catch (err) {
        statusEl.textContent = 'Failed to load projects. Please try again later.';
        console.error(err);
      }
    }

    function populateLanguageFilter(projects) {
      const languages = [...new Set(projects.map(p => p.language).filter(Boolean))];
      languages.forEach(lang => {
        const opt = document.createElement('option');
        opt.value = lang;
        opt.textContent = lang;
        languageSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      const query = searchInput.value.toLowerCase();
      const selectedLang = languageSelect.value;

      filteredProjects = allProjects.filter(project => {
        const matchesQuery = project.name.toLowerCase().includes(query) || 
                             (project.description && project.description.toLowerCase().includes(query));
        const matchesLang = selectedLang === 'all' || project.language === selectedLang;
        return matchesQuery && matchesLang;
      });

      renderPage();
    }

    function totalPages() {
      return Math.ceil(filteredProjects.length / ITEMS_PER_PAGE) || 1;
    }

    function renderPage() {
      grid.innerHTML = '';

      if (filteredProjects.length === 0) {
        grid.innerHTML = '<div id="status">No matching projects found.</div>';
        paginationControls.style.display = 'none';
        return;
      }

      paginationControls.style.display = 'flex';

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const pageItems = filteredProjects.slice(startIndex, endIndex);

      pageItems.forEach(repo => {
        const liveUrl = repo.homepage && repo.homepage.startsWith('http') 
          ? repo.homepage 
          : `https://${USERNAME}.github.io/${repo.name}/`;

        // Generates live screenshot preview using Microlink screenshot API
        const previewApiUrl = `https://api.microlink.io/?url=${encodeURIComponent(liveUrl)}&screenshot=true&embed=screenshot.url`;

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="preview-container">
            <img src="${previewApiUrl}" alt="${repo.name} Preview" class="preview-img" loading="lazy" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="preview-fallback" style="display: none;">
              No Preview Available
            </div>
          </div>
          <div class="card-body">
            <h2 class="card-title">${repo.name.replace(/-/g, ' ')}</h2>
            <p class="card-desc">${repo.description || 'No description provided.'}</p>
            <div class="card-footer">
              ${repo.language ? `<span class="badge">${repo.language}</span>` : '<span></span>'}
              <div class="actions">
                <a href="${liveUrl}" target="_blank" class="btn btn-primary">Live Demo</a>
                <a href="${repo.html_url}" target="_blank" class="btn btn-outline">Code</a>
              </div>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      // Update Pagination state
      pageInfo.textContent = `Page ${currentPage} of ${totalPages()}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages();
    }

    init();
  </script>
</body>
</html>
